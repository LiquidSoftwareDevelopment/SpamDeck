<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">SpamDeck</title>
  <desc id="desc">SpamDeck: charge spammers to pitch each other. A 1995 web page: a welcome marquee, a pixel playing card whose index reads dollar over at sign, a THEY PAY starburst, a hit counter, an under construction stripe and a row of 88 by 31 badges. Every payment simulated.</desc>
  <defs>
    <g id="ix" fill="#FF0000">
      <rect x="4" y="2" width="1" height="1"/><rect x="3" y="3" width="4" height="1"/><rect x="2" y="4" width="1" height="1"/><rect x="4" y="4" width="1" height="1"/><rect x="3" y="5" width="3" height="1"/><rect x="4" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/><rect x="2" y="7" width="4" height="1"/><rect x="4" y="8" width="1" height="1"/>
      <rect x="3" y="10" width="3" height="1"/><rect x="2" y="11" width="1" height="1"/><rect x="6" y="11" width="1" height="1"/><rect x="2" y="12" width="1" height="1"/><rect x="4" y="12" width="3" height="1"/><rect x="2" y="13" width="1" height="1"/><rect x="4" y="13" width="1" height="1"/><rect x="6" y="13" width="1" height="1"/><rect x="2" y="14" width="1" height="1"/><rect x="4" y="14" width="3" height="1"/><rect x="2" y="15" width="1" height="1"/><rect x="3" y="16" width="4" height="1"/>
    </g>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="24" height="24" patternTransform="rotate(45)">
      <rect x="0" y="0" width="12" height="24" fill="#FFFF00"/>
      <rect x="12" y="0" width="12" height="24" fill="#000000"/>
    </pattern>
    <clipPath id="barclip"><rect x="26" y="22" width="1228" height="36"/></clipPath>
  </defs>

  <!-- silver page, white document panel with the Windows 95 bevel and a 1px black outline -->
  <rect width="1280" height="640" fill="#C0C0C0"/>
  <g shape-rendering="crispEdges">
    <rect x="23" y="19" width="1234" height="602" fill="#000000"/>
    <rect x="24" y="20" width="1232" height="600" fill="#FFFFFF"/>
    <rect x="1254" y="20" width="2" height="600" fill="#808080"/>
    <rect x="24" y="618" width="1232" height="2" fill="#808080"/>
    <!-- navy welcome bar -->
    <rect x="26" y="22" width="1228" height="36" fill="#000080"/>
  </g>
  <text x="26" y="46" clip-path="url(#barclip)" font-family="'Times New Roman',Times,serif" font-weight="bold" font-size="18" fill="#FFFF00" xml:space="preserve">*** WELCOME TO SPAMDECK *** YOU ARE VISITOR NUMBER 000022 *** CHARGE SPAMMERS TO PITCH EACH OTHER *** EVERY PAYMENT SIMULATED ***</text>

  <!-- the mark: a pixel playing card, 98 by 140 -->
  <g transform="translate(241 83) scale(7)" shape-rendering="crispEdges">
    <rect x="1" y="1" width="12" height="18" fill="#FFFFFF"/>
    <g fill="#000000"><rect x="1" y="0" width="12" height="1"/><rect x="1" y="19" width="12" height="1"/><rect x="0" y="1" width="1" height="18"/><rect x="13" y="1" width="1" height="18"/></g>
    <use xlink:href="#ix" href="#ix"/>
    <use xlink:href="#ix" href="#ix" transform="rotate(180 7 10)"/>
  </g>

  <!-- wordmark with a hard black shadow, then the tagline -->
  <text x="367" y="158.4" font-family="'Times New Roman',Times,serif" font-weight="bold" font-size="72" fill="#000000">SpamDeck</text>
  <text x="363" y="154.4" font-family="'Times New Roman',Times,serif" font-weight="bold" font-size="72" fill="#FF0000">SpamDeck</text>
  <text x="363" y="204.4" font-family="'Times New Roman',Times,serif" font-style="italic" font-size="32" fill="#000000">Charge spammers to pitch each other.</text>

  <!-- THEY PAY starburst, 150 by 150 -->
  <g transform="translate(889 78) scale(1.5)">
    <polygon points="98,50 84.8,59.3 91.6,74 75.5,75.5 74,91.6 59.3,84.8 50,98 40.7,84.8 26,91.6 24.5,75.5 8.4,74 15.2,59.3 2,50 15.2,40.7 8.4,26 24.5,24.5 26,8.4 40.7,15.2 50,2 59.3,15.2 74,8.4 75.5,24.5 91.6,26 84.8,40.7" fill="#FFFF00" stroke="#000000" stroke-width="1.5"/>
    <g font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="15" fill="#800000" text-anchor="middle" transform="rotate(-10 50 50)">
      <text x="50" y="47">THEY</text>
      <text x="50" y="64">PAY</text>
    </g>
  </g>

  <!-- rainbow rule: six hard stops -->
  <g shape-rendering="crispEdges">
    <rect x="66" y="242" width="192" height="8" fill="#FF0000"/>
    <rect x="258" y="242" width="191" height="8" fill="#FFFF00"/>
    <rect x="449" y="242" width="191" height="8" fill="#00FF00"/>
    <rect x="640" y="242" width="192" height="8" fill="#00FFFF"/>
    <rect x="832" y="242" width="191" height="8" fill="#0000FF"/>
    <rect x="1023" y="242" width="191" height="8" fill="#FF00FF"/>
  </g>

  <!-- the pitch -->
  <g font-family="'Times New Roman',Times,serif" font-size="24" fill="#000000" text-anchor="middle">
    <text x="640" y="287">A sales pitch I don't want may contain a business connection someone else values.</text>
    <text x="640" y="318.19">The Dealer reads the pitches you never asked for, finds the companies that want each other, and lets them pay for</text>
    <text x="640" y="349.38">the introduction. Your inbox gets a cut.</text>
  </g>

  <!-- visitor counter, under construction, NEW!, the simulated amount -->
  <text x="134.07" y="395.57" font-family="'Times New Roman',Times,serif" font-size="16" fill="#000000">You are visitor number</text>
  <g shape-rendering="crispEdges">
    <rect x="291.32" y="373.57" width="24" height="34" fill="#808080"/><rect x="292.32" y="374.57" width="22" height="32" fill="#000000"/>
    <rect x="316.32" y="373.57" width="24" height="34" fill="#808080"/><rect x="317.32" y="374.57" width="22" height="32" fill="#000000"/>
    <rect x="341.32" y="373.57" width="24" height="34" fill="#808080"/><rect x="342.32" y="374.57" width="22" height="32" fill="#000000"/>
    <rect x="366.32" y="373.57" width="24" height="34" fill="#808080"/><rect x="367.32" y="374.57" width="22" height="32" fill="#000000"/>
    <rect x="391.32" y="373.57" width="24" height="34" fill="#808080"/><rect x="392.32" y="374.57" width="22" height="32" fill="#000000"/>
    <rect x="416.32" y="373.57" width="24" height="34" fill="#808080"/><rect x="417.32" y="374.57" width="22" height="32" fill="#000000"/>
  </g>
  <g font-family="'Courier New',Courier,monospace" font-weight="bold" font-size="22" fill="#FFFFFF" text-anchor="middle">
    <text x="303.32" y="395.57">0</text>
    <text x="328.32" y="395.57">0</text>
    <text x="353.32" y="395.57">0</text>
    <text x="378.32" y="395.57">0</text>
    <text x="403.32" y="395.57">2</text>
    <text x="428.32" y="395.57">2</text>
  </g>
  <rect x="477.32" y="378.57" width="230" height="24" fill="url(#stripes)"/>
  <rect x="518.43" y="382.07" width="147.78" height="17" fill="#FFFF00" stroke="#000000" stroke-width="1"/>
  <text x="592.32" y="394.57" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="11" fill="#000000" text-anchor="middle">UNDER CONSTRUCTION</text>
  <rect x="743.82" y="382.57" width="40.33" height="16" fill="#FFFF00" stroke="#000000" stroke-width="1"/>
  <text x="763.99" y="394.07" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="11" fill="#800000" text-anchor="middle">NEW!</text>
  <text x="820.65" y="394.57" font-family="'Courier New',Courier,monospace" font-size="16" fill="#000000"><tspan fill="#800000">$75.00</tspan> paid by the pitcher <tspan font-size="10">[SIMULATED]</tspan></text>

  <!-- six 88 by 31 badges -->
  <g font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="9" text-anchor="middle">
    <rect x="361.5" y="424.07" width="87" height="30" fill="#000000" stroke="#808080" stroke-width="1"/>
    <text x="405" y="437.07" fill="#FFFFFF">NO BUILD</text><text x="405" y="447.07" fill="#FFFFFF">STEP</text>
    <rect x="455.5" y="424.07" width="87" height="30" fill="#000080" stroke="#000000" stroke-width="1"/>
    <text x="499" y="437.07" fill="#FFFF00">ZERO</text><text x="499" y="447.07" fill="#FFFF00">DEPENDENCIES</text>
    <g shape-rendering="crispEdges">
      <rect x="549" y="423.57" width="88" height="31" fill="#C0C0C0"/>
      <rect x="549" y="452.57" width="88" height="2" fill="#000000"/><rect x="635" y="423.57" width="2" height="31" fill="#000000"/>
      <rect x="549" y="423.57" width="88" height="2" fill="#FFFFFF"/><rect x="549" y="423.57" width="2" height="31" fill="#FFFFFF"/>
    </g>
    <text x="593" y="437.07" fill="#000000">TESTS</text><text x="593" y="447.07" fill="#000000">PASS</text>
    <rect x="644" y="424.57" width="86" height="29" fill="#FFFFFF" stroke="#000080" stroke-width="2"/>
    <text x="687" y="437.07" fill="#000080">NOTHING</text><text x="687" y="447.07" fill="#000080">SENT</text>
    <rect x="737.5" y="424.07" width="87" height="30" fill="#800000" stroke="#000000" stroke-width="1"/>
    <text x="781" y="437.07" fill="#FFFFFF">MADE WITH</text><text x="781" y="447.07" fill="#FFFFFF">CLAUDE CODE</text>
    <rect x="831.5" y="424.07" width="87" height="30" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="875" y="437.07" fill="#000000">BEST VIEWED</text><text x="875" y="447.07" fill="#000000">IN ANY BROWSER</text>
  </g>

  <!-- webmaster line -->
  <text x="640" y="600" font-family="'Courier New',Courier,monospace" font-size="13" fill="#000000" text-anchor="middle">Every company fictional · every payment simulated · nothing sent · Webmaster: the Dealer · Last updated 24 October 2026</text>
</svg>
